# =====================================================================
#  BASELINE INSEGURO (solo laboratorio)
#  - MongoDB sin --auth y con el puerto 27017 publicado
#  - Elasticsearch sin seguridad (xpack.security.enabled=false) y 9200 publicado
#  - API FastAPI vulnerable (NoSQLi + paso directo de la query a ES)
# =====================================================================
name: nosql-lab-inseguro

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    environment:
      MONGO_INITDB_DATABASE: tienda
    volumes:
      - ./init_mongo.js:/docker-entrypoint-initdb.d/init_mongo.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    ports: ["9200:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 5s
      retries: 40

  es-init:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "/init_elastic.sh"]
    environment:
      ES_URL: http://elasticsearch:9200
    volumes:
      - ./init_elastic.sh:/init_elastic.sh:ro
    depends_on:
      elasticsearch: { condition: service_healthy }

  fastapi-app:
    build: ./fastapi-app
    ports: ["8000:8000"]
    environment:
      APP_MODULE: main_vulnerable:app
      MONGO_HOST: mongo
      MONGO_DATABASE: tienda
      ELASTIC_HOST: elasticsearch
    depends_on:
      mongo: { condition: service_healthy }
      es-init: { condition: service_completed_successfully }
